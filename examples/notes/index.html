<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title>
<style>
  :root { color: var(--color-primary, var(--mew-primary, #e1e3e2)); background: var(--color-background, var(--mew-background, #090a0b)); font: 400 14px/1.5 var(--mew-font-sans, Geist, sans-serif); --line: color-mix(in srgb, var(--mew-primary, #e1e3e2) 9%, var(--mew-background, #090a0b)); }
  * { box-sizing: border-box; }
  body { min-height: 100dvh; height: 100dvh; margin: 0; display: flex; flex-direction: column; }
  h1, h2, p { margin: 0; font-weight: 400; }
  h1 { font-size: 16px; }
  h2 { font-size: 14px; }
  .dim, #count { color: var(--color-secondary, var(--mew-secondary, #a4a7a6)); }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  .heading, .actions { display: flex; align-items: center; gap: 8px; }
  .heading .dim { font-size: 12px; }
  main { display: flex; flex: 1; min-height: 200px; }
  .editor { display: flex; flex: 1; flex-direction: column; min-width: 0; }
  .editor > label { padding: 20px 24px 0; color: var(--color-secondary, var(--mew-secondary, #a4a7a6)); font-size: 12px; }
  textarea { flex: 1; min-height: 200px; width: 100%; resize: none; border: 0; padding: 12px 24px 24px; color: inherit; background: transparent; font: inherit; line-height: 1.8; outline-offset: -3px; }
  textarea::placeholder { color: var(--color-secondary, var(--mew-secondary, #a4a7a6)); }
  textarea:focus-visible { outline: 1px solid var(--color-focus, var(--mew-secondary, #a4a7a6)); }
  textarea:disabled { opacity: .55; }
  footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 20px; border-top: 1px solid var(--line); font-size: 12px; }
  footer .actions { flex-wrap: wrap; }
  #conflict { flex: 0 1 360px; min-width: 260px; border-left: 1px solid var(--line); padding: 20px; overflow: auto; }
  #conflict p { margin: 8px 0 16px; font-size: 13px; }
  #conflict pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; padding: 12px; background: color-mix(in srgb, var(--mew-primary, #e1e3e2) 4%, transparent); border-radius: 4px; }
  #conflict .actions { flex-wrap: wrap; }
  [hidden] { display: none !important; }
  body.focus .privacy, body.focus .editor > label { display: none; }
  body.focus textarea { padding-top: 24px; }
  @media (max-width: 600px) { header, footer { padding-inline: 12px; } .editor > label { padding-inline: 16px; } textarea { padding-inline: 16px; } main { flex-direction: column; } #conflict { flex: none; min-width: 0; border-left: 0; border-top: 1px solid var(--line); padding: 16px; } }
</style>
</head>
<body>
<header><div class="heading"><h1>Notes</h1><span class="dim privacy">Only you</span></div><div class="actions"><button id="focus" aria-pressed="false">Focus</button><button id="restore" disabled>Discard changes</button><button id="save" disabled>Save</button></div></header>
<main>
  <div class="editor"><label for="notes">Your notes</label><textarea id="notes" maxlength="8000" disabled placeholder="Start writing…" spellcheck="true"></textarea></div>
  <section id="conflict" hidden aria-label="Review saved version"><h2>Review saved text</h2><p class="dim">Your draft is still in the editor. Choose which version to keep.</p><pre id="remote"></pre><div class="actions"><button id="use">Use saved text</button><button id="keep">Keep my draft</button></div></section>
</main>
<footer><div class="actions"><span id="status" role="status">Loading your notes…</span><button id="retry" hidden>Retry</button></div><span id="count">0 words · 0 / 8000</span></footer>
<script>
  mew.ui.install();
  for (const button of document.querySelectorAll('button')) {
    button.type = 'button';
    button.className = 'ui-button';
    button.dataset.variant = button.id === 'save' || button.id === 'use' ? 'primary' : 'ghost';
  }
  const notes = document.querySelector('#notes');
  const status = document.querySelector('#status');
  const save = document.querySelector('#save');
  const restore = document.querySelector('#restore');
  const conflict = document.querySelector('#conflict');
  const retry = document.querySelector('#retry');
  let current;
  let busy = false;
  const text = () => String(current?.value.text || '');
  function refresh() {
    const words = notes.value.trim().split(/\s+/).filter(Boolean).length;
    document.querySelector('#count').textContent = `${words} ${words === 1 ? 'word' : 'words'} · ${notes.value.length} / 8000`;
    save.disabled = !current || busy || !conflict.hidden || notes.value === text();
    restore.disabled = !current || busy || notes.value === text();
    save.textContent = busy ? 'Saving…' : 'Save';
    save.setAttribute('aria-busy', String(busy));
  }
  async function load() {
    retry.hidden = true;
    status.textContent = 'Loading your notes…';
    try {
      current = await mew.state.get('private');
      notes.value = text();
      notes.disabled = false;
      status.textContent = 'All changes saved';
    } catch { status.textContent = 'Your notes couldn’t be loaded.'; retry.hidden = false; }
    refresh();
  }
  retry.onclick = load;
  notes.oninput = () => { status.textContent = notes.value === text() ? 'All changes saved' : 'Unsaved changes'; refresh(); };
  restore.onclick = () => { document.querySelector('#remote').textContent = text() || '(Empty note)'; conflict.hidden = false; refresh(); document.querySelector('#use').focus(); };
  document.querySelector('#use').onclick = () => { notes.value = text(); conflict.hidden = true; status.textContent = 'All changes saved'; refresh(); notes.focus(); };
  document.querySelector('#keep').onclick = () => { conflict.hidden = true; status.textContent = 'Draft kept. Save when you’re ready.'; refresh(); notes.focus(); };
  document.querySelector('#focus').onclick = (event) => { const focused = document.body.classList.toggle('focus'); event.target.setAttribute('aria-pressed', String(focused)); event.target.textContent = focused ? 'Exit focus' : 'Focus'; notes.focus(); };
  save.onclick = async () => {
    if (!current || busy || !conflict.hidden || notes.value === text()) return;
    busy = true;
    notes.disabled = true;
    refresh();
    const draft = notes.value;
    try {
      current = await mew.state.put('private', { expected_revision: current.revision, value: { ...current.value, text: draft } });
      status.textContent = 'All changes saved';
    } catch {
      try {
        const latest = await mew.state.get('private');
        const changed = latest.revision !== current.revision;
        current = latest;
        if (changed) {
          document.querySelector('#remote').textContent = text() || '(Empty note)';
          conflict.hidden = false;
          status.textContent = 'Saved text changed elsewhere. Review it alongside your draft.';
        } else status.textContent = 'Couldn’t save. Your draft is kept; try again.';
      } catch { status.textContent = 'Couldn’t save. Your draft is kept; try again.'; }
    }
    notes.disabled = false;
    busy = false;
    refresh();
  };
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') { event.preventDefault(); if (!save.disabled) save.click(); }
  });
  load();
</script>
</body></html>
