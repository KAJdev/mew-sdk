<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Private notes</title>
<style>
  body { max-width: 40rem; margin: 2rem auto; }
  textarea, button { font: inherit; color: inherit; background: var(--mew-background); border: 1px solid var(--mew-tertiary); padding: .5rem; }
  textarea { display: block; width: 100%; min-height: 12rem; resize: vertical; }
  p { color: var(--mew-secondary); }
</style></head>
<body>
<h1>Private notes</h1>
<p>Only you can read these notes.</p>
<textarea id="notes" maxlength="8000" aria-label="Notes"></textarea>
<p><button id="save">Save</button> <span id="status" role="status">Loading...</span></p>
<script>
  const notes = document.querySelector('#notes');
  const status = document.querySelector('#status');
  let current;
  mew.state.get('private').then((state) => {
    current = state;
    notes.value = String(state.value.text || '');
    status.textContent = 'Ready';
  }, () => { status.textContent = 'Notes are unavailable.'; });
  document.querySelector('#save').onclick = async () => {
    try {
      current = await mew.state.put('private', { expected_revision: current.revision, value: { text: notes.value } });
      status.textContent = 'Saved';
    } catch {
      current = await mew.state.get('private');
      status.textContent = 'Notes changed elsewhere. Your text is kept here; save again to overwrite.';
    }
  };
</script>
</body></html>
