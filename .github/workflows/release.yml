name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Nothing was published."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Match tag to package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "mew-sdk@$version" version >/dev/null 2>&1; then
            echo "mew-sdk@$version is already published"
          else
            npm publish --provenance --access public
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun scripts/build-binaries.mjs dist
      - name: Checksums
        working-directory: dist
        run: |
          cp ../install.sh ../install.ps1 .
          sha256sum mew-* install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - run: ./dist/mew-linux-x64 --version
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/mew-*
            dist/install.sh
            dist/install.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "mew $GITHUB_REF_NAME" --generate-notes
