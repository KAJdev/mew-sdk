name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm test
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: MEW_TARGETS=linux-x64 bun scripts/build-binaries.mjs dist
      - run: ./dist/mew-linux-x64 --version
      - run: sh -n install.sh
